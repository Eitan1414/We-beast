name: Wii U native build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install complete Wii U development group
        shell: bash
        run: |
          set -euo pipefail
          dkp-pacman -Syu --needed --noconfirm wiiu-dev

      - name: Convert GLB props to Wii U WBM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-runtime

          python3 tools/glb_to_wbm.py \
            assets/source/props/big_box.glb \
            build-runtime/prop_big_box.wbm

          convert_optional_prop() {
            local output="$1"
            shift
            local source
            for source in "$@"; do
              if [ -f "$source" ]; then
                python3 tools/glb_to_wbm.py "$source" "build-runtime/$output"
                return 0
              fi
            done
            echo "Optional prop source missing for $output; runtime marker fallback stays enabled."
          }

          convert_optional_prop prop_small_box.wbm \
            assets/source/props/throwable_box_1.glb \
            "assets/source/props/throwable box 1.glb"

          convert_optional_prop prop_explosive_barrel.wbm \
            assets/source/props/explosive_barrel.glb \
            "assets/source/props/explosive_baril.glb"

          test -s build-runtime/prop_big_box.wbm
          ls -lh build-runtime/*.wbm

      - name: Configure Wii U build
        shell: bash
        run: |
          set -euo pipefail
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
            -S . -B build-wiiu -DCMAKE_BUILD_TYPE=Release

      - name: Compile RPX
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-wiiu --parallel 2

      - name: Verify RPX
        shell: bash
        run: |
          set -euo pipefail
          test -f build-wiiu/webeast_wiiu.rpx
          ls -lh build-wiiu/webeast_wiiu.rpx

      - name: Package Aroma WUHB
        shell: bash
        run: |
          set -euo pipefail
          WUHBTOOL="${DEVKITPRO}/tools/bin/wuhbtool"
          test -x "$WUHBTOOL"
          "$WUHBTOOL" \
            build-wiiu/webeast_wiiu.rpx \
            build-wiiu/WeBeast-V0.1.wuhb \
            --name="We Beast V0.1" \
            --short-name="We Beast" \
            --author="Pixel Electronics Studio"
          test -s build-wiiu/WeBeast-V0.1.wuhb
          ls -lh build-wiiu/WeBeast-V0.1.wuhb

      - name: Prepare Aroma SD package
        shell: bash
        run: |
          set -euo pipefail
          APPS_DIR=dist/wiiu/apps
          CONTENT_DIR="$APPS_DIR/webeast/content"
          mkdir -p "$CONTENT_DIR"

          # Aroma launches the WUHB directly from sd:/wiiu/apps/.
          cp build-wiiu/WeBeast-V0.1.wuhb "$APPS_DIR/"

          # V0.1 currently reads runtime data from this SD content directory.
          cp assets/runtime/shaders/pos_col_shader.gsh "$CONTENT_DIR/"
          cp build-runtime/*.wbm "$CONTENT_DIR/"

          if [ -f assets/runtime/audio/car_honk.pcm ]; then
            cp assets/runtime/audio/car_honk.pcm "$CONTENT_DIR/"
          fi
          if [ -f assets/runtime/map_02.wbm ]; then
            cp assets/runtime/map_02.wbm "$CONTENT_DIR/"
          fi
          if [ -f assets/runtime/map_01.wbm ]; then
            cp assets/runtime/map_01.wbm "$CONTENT_DIR/"
          fi

          find dist -type f -maxdepth 6 -print -exec ls -lh {} \;

      - name: Upload Aroma WUHB
        uses: actions/upload-artifact@v4
        with:
          name: webeast-v0.1-aroma-wuhb
          if-no-files-found: error
          path: build-wiiu/WeBeast-V0.1.wuhb

      - name: Upload Aroma SD package
        uses: actions/upload-artifact@v4
        with:
          name: webeast-v0.1-aroma-sd-package
          if-no-files-found: error
          path: dist/wiiu/**
