name: Wii U native build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20260503

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install complete Wii U development group
        shell: bash
        run: |
          set -euo pipefail
          dkp-pacman -Syu --needed --noconfirm wiiu-dev

      - name: Convert GLB props to Wii U WBM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-runtime

          python3 tools/glb_to_wbm.py \
            assets/source/props/big_box.glb \
            build-runtime/prop_big_box.wbm

          convert_optional_prop() {
            local output="$1"
            shift
            local source
            for source in "$@"; do
              if [ -f "$source" ]; then
                python3 tools/glb_to_wbm.py "$source" "build-runtime/$output"
                return 0
              fi
            done
            echo "Optional prop source missing for $output; runtime marker fallback stays enabled."
          }

          convert_optional_prop prop_small_box.wbm \
            assets/source/props/throwable_box_1.glb \
            "assets/source/props/throwable box 1.glb"

          convert_optional_prop prop_explosive_barrel.wbm \
            assets/source/props/explosive_barrel.glb \
            "assets/source/props/explosive_baril.glb"

          test -s build-runtime/prop_big_box.wbm
          ls -lh build-runtime/*.wbm

      - name: Build Map 2 runtime asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-runtime

          # Prefer the real editable Map 2 once it is committed.
          if [ -f "assets/source/maps/map 2.glb" ]; then
            python3 tools/glb_to_wbm.py "assets/source/maps/map 2.glb" build-runtime/map_02.wbm
          elif [ -f assets/source/maps/map_02.glb ]; then
            python3 tools/glb_to_wbm.py assets/source/maps/map_02.glb build-runtime/map_02.wbm
          elif [ -f assets/runtime/map_02.wbm ]; then
            cp assets/runtime/map_02.wbm build-runtime/map_02.wbm
          else
            # Hardware-test fallback: generate a tiny standards-compliant GLB,
            # then run it through We Beast's own converter. This avoids duplicating
            # the WBM1 binary layout here and guarantees parser compatibility.
            python3 - <<'PY'
          import json, struct
          from pathlib import Path

          positions = [
              (-6.0, 0.0, -6.0),
              ( 6.0, 0.0, -6.0),
              ( 6.0, 0.0,  6.0),
              (-6.0, 0.0,  6.0),
          ]
          indices = [0, 2, 1, 0, 3, 2]

          binary = bytearray()
          for p in positions:
              binary += struct.pack('<3f', *p)
          index_offset = len(binary)
          for i in indices:
              binary += struct.pack('<H', i)
          while len(binary) % 4:
              binary += b'\0'

          gltf = {
              'asset': {'version': '2.0'},
              'buffers': [{'byteLength': len(binary)}],
              'bufferViews': [
                  {'buffer': 0, 'byteOffset': 0, 'byteLength': len(positions) * 12, 'target': 34962},
                  {'buffer': 0, 'byteOffset': index_offset, 'byteLength': len(indices) * 2, 'target': 34963},
              ],
              'accessors': [
                  {'bufferView': 0, 'componentType': 5126, 'count': 4, 'type': 'VEC3',
                   'min': [-6.0, 0.0, -6.0], 'max': [6.0, 0.0, 6.0]},
                  {'bufferView': 1, 'componentType': 5123, 'count': 6, 'type': 'SCALAR'},
              ],
              'meshes': [{'primitives': [{'attributes': {'POSITION': 0}, 'indices': 1}]}],
              'nodes': [{'mesh': 0}],
              'scenes': [{'nodes': [0]}],
              'scene': 0,
          }

          json_bytes = json.dumps(gltf, separators=(',', ':')).encode('utf-8')
          while len(json_bytes) % 4:
              json_bytes += b' '
          total = 12 + 8 + len(json_bytes) + 8 + len(binary)
          glb = bytearray(struct.pack('<III', 0x46546C67, 2, total))
          glb += struct.pack('<II', len(json_bytes), 0x4E4F534A) + json_bytes
          glb += struct.pack('<II', len(binary), 0x004E4942) + binary
          Path('build-runtime/map_02_fallback.glb').write_bytes(glb)
          PY
            python3 tools/glb_to_wbm.py build-runtime/map_02_fallback.glb build-runtime/map_02.wbm
          fi

          test -s build-runtime/map_02.wbm
          ls -lh build-runtime/map_02.wbm

      - name: Configure Wii U build
        shell: bash
        run: |
          set -euo pipefail
          /opt/devkitpro/portlibs/wiiu/bin/powerpc-eabi-cmake \
            -S . -B build-wiiu -DCMAKE_BUILD_TYPE=Release

      - name: Compile RPX
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-wiiu --parallel 2

      - name: Verify RPX
        shell: bash
        run: |
          set -euo pipefail
          test -f build-wiiu/webeast_wiiu.rpx
          ls -lh build-wiiu/webeast_wiiu.rpx

      - name: Prepare Wii U SD package
        shell: bash
        run: |
          set -euo pipefail
          APP_DIR=dist/wiiu/apps/webeast
          CONTENT_DIR="$APP_DIR/content"
          mkdir -p "$CONTENT_DIR"

          cp build-wiiu/webeast_wiiu.rpx "$APP_DIR/"
          cp assets/runtime/shaders/pos_col_shader.gsh "$CONTENT_DIR/"
          cp build-runtime/*.wbm "$CONTENT_DIR/"

          if [ -f assets/runtime/audio/car_honk.pcm ]; then
            cp assets/runtime/audio/car_honk.pcm "$CONTENT_DIR/"
          fi
          if [ -f assets/runtime/map_01.wbm ]; then
            cp assets/runtime/map_01.wbm "$CONTENT_DIR/"
          fi

          test -s "$CONTENT_DIR/map_02.wbm"
          find dist -type f -maxdepth 6 -print -exec ls -lh {} \;

      - name: Upload Wii U RPX
        uses: actions/upload-artifact@v4
        with:
          name: webeast-wiiu-rpx
          if-no-files-found: error
          path: build-wiiu/webeast_wiiu.rpx

      - name: Upload Wii U SD package
        uses: actions/upload-artifact@v4
        with:
          name: webeast-wiiu-sd-package
          if-no-files-found: error
          path: dist/wiiu/**
